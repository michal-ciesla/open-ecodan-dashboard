name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm test
      - run: npm run check
      - run: git diff --exit-code -- dist/
      - uses: actions/upload-artifact@v4
        with:
          name: open-ecodan-dashboard
          path: dist/open-ecodan-dashboard.js
